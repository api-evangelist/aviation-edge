  note: >-
    Aviation Edge publishes no compliance program, no certifications and no trust center, so
    no Compliance pointer is emitted. What it does conform to is the aviation domain's own
    identifier standards, which is the standard that matters for this market: every request
    filter and response field is keyed on IATA and ICAO codes and ISO country codes, so a
    consumer that already speaks aviation coding integrates without a translation layer.
