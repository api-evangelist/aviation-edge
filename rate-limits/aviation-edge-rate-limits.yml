specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Aviation Edge
providerId: aviation-edge
generated: '2026-09-04'
method: searched
source: >-
  https://aviation-edge.com/premium-api/ and https://aviation-edge.com/frequently-asked-questions/
  for the published quotas; live unauthenticated probes of https://aviation-edge.com/v2/public/
  on 2026-09-04 for the response headers.
created: '2026-05-04'
modified: '2026-09-04'
tags:
  - Aviation
  - Rate Limiting
  - Quotas
description: >-
  Aviation Edge enforces a monthly API-call allowance per subscription key and publishes no
  per-second or per-minute rate limit. This file replaces the 2026-05-04 scaffold, whose
  10 requests/minute figure and X-RateLimit-* header set were placeholders that the provider
  does not implement.
limit_count: 4
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    PROBED 2026-09-04: no RateLimit-*, X-RateLimit-* or Retry-After header is present on any
    live response. The response headers carry only date, content-type, CORS, HSTS,
    x-content-type-options, x-frame-options, x-powered-by and Cloudflare's own headers. An
    agent cannot discover its remaining quota from the runtime signal — only from the account
    dashboard.
responseCodes:
  throttled: unknown
  quotaExceeded: unknown
  note: >-
    The behaviour on exhausting the monthly allowance is not documented and could not be
    observed without a subscription key. The FAQ says an over-limit account is expected to
    upgrade from the dashboard, with the higher limit applied immediately.
limits:
  - tier: Developer
    name: Developer monthly allowance
    scope: api-key
    metric: requests
    limit: 30000
    timeFrame: month
    source: https://aviation-edge.com/premium-api/
  - tier: Business
    name: Business monthly allowance
    scope: api-key
    metric: requests
    limit: 100000
    timeFrame: month
    source: https://aviation-edge.com/premium-api/
  - tier: Business Gold
    name: Business Gold monthly allowance
    scope: api-key
    metric: requests
    limit: 500000
    timeFrame: month
    source: https://aviation-edge.com/premium-api/
  - tier: Unlimited Data
    name: Unlimited plan
    scope: api-key
    metric: requests
    limit: null
    timeFrame: month
    source: https://aviation-edge.com/premium-api/
    note: Advertised as unlimited calls with "no usage restrictions*"; the asterisk is not expanded on the page.
counting_rules:
  - >-
    One successful data pull is one API call regardless of how much data it returns — a whole
    airport schedule and a single flight both count as one.
  - >-
    Error responses (incorrect endpoint use, or requested data unavailable) do not count
    against the allowance, per the FAQ.
  - >-
    A single call can return up to 30,000 records on /flights and /satelliteDetails via the
    limit parameter, which makes bulk pulls quota-cheap and is the provider's recommended
    pattern.
