  note: >-
    Aviation Edge ships two thin first-party client wrappers, both unmaintained since 2017.
    The npm package `aviation-edge` names "Aviation Edge" as its author and installs the
    NodeJs-SDK code; the PHP SDK is published only as a single file in the provider's GitHub
    account with no Packagist release. No Python, Ruby, Go, Java, .NET or Rust client exists,
    first-party or otherwise, and the provider's own FAQ says it publishes no
    implementation guides. Both SDKs predate the NOTAMs API (2026) and the
    /planeTypeDatabase and /taxDatabase endpoints, so neither wraps the current surface.
