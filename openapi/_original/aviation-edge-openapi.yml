openapi: 3.2.0
info:
  title: Aviation Edge API
  version: v2
  description: 'Aviation Edge provides global aviation data: real-time flight tracking, historical and future airport
    schedules, airline routes, NOTAMs, satellite tracking, and static airport, airline, aircraft, city, country,
    tax and timezone databases. Every endpoint is JSON over HTTPS GET and requires an API key passed as the `key`
    query parameter. Errors are returned as HTTP 200 with an `{"error"|"message": ..., "success": false}` envelope
    on most endpoints; /flightsHistory and /flightsFuture answer HTTP 400 when a required parameter is missing.'
  contact:
    name: Aviation Edge
    url: https://aviation-edge.com/contact/
  termsOfService: https://aviation-edge.com/api-terms-of-service/
externalDocs:
  url: https://aviation-edge.com/developers/
  description: Aviation Edge developer documentation
x-provenance:
  generated: '2026-09-04'
  method: searched
  source: 'Harvested from Aviation Edge first-party sources: the provider GitHub account github.com/AviationEdgeAPI
    (Aviation-Edge-Complete-API, Notam-API, Satellite-Tracker-API, Airport-Schedules-API, Historical-Schedules-API,
    Future-Schedules-API, Airline-Routes-API, Autocomplete-API, Static-Aviation-APIs READMEs) and the developer
    documentation at https://aviation-edge.com/developers/. Paths and required parameters were confirmed with unauthenticated
    live probes against https://aviation-edge.com/v2/public/ on 2026-09-04.'
servers:
- url: https://aviation-edge.com/v2/public
  description: Aviation Edge public v2 API
security:
- ApiKeyAuth: []
tags:
- name: Real-Time
  description: Real-time and historical flight tracking
- name: Schedules
  description: Airport schedules and flight timetables
- name: Reference
  description: Static reference data
- name: Satellites
  description: Satellite tracking data
- name: NOTAMs
  description: Airport and FIR NOTAM data
paths:
  /flights:
    get:
      tags:
      - Real-Time
      summary: Real-time flight tracker
      description: Returns real-time positional data for live flights worldwide. Filterable by airline, departure
        or arrival airport, flight number, or a radius around a coordinate. Updated approximately every 5 minutes.
      operationId: getRealTimeFlights
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: flightIata
        in: query
        schema:
          type: string
        description: Flight IATA code, e.g. W8519
      - name: airlineIata
        in: query
        schema:
          type: string
        description: Airline IATA code, e.g. W8
      - name: depIata
        in: query
        schema:
          type: string
        description: Departure airport IATA code
      - name: arrIata
        in: query
        schema:
          type: string
        description: Arrival airport IATA code
      - name: lat
        in: query
        schema:
          type: number
        description: Latitude of the centre of a search circle
      - name: lng
        in: query
        schema:
          type: number
        description: Longitude of the centre of a search circle
      - name: distance
        in: query
        schema:
          type: integer
        description: Radius of the search circle, used with lat and lng
      - name: regNum
        in: query
        schema:
          type: string
        description: Aircraft registration number, e.g. CGTCJ (published as an example parameter on https://aviation-edge.com/get.php)
      - name: aircraftIcao
        in: query
        schema:
          type: string
        description: Aircraft ICAO type code, e.g. B752 (published as an example parameter on https://aviation-edge.com/get.php)
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - active
          - landed
          - cancelled
          - incident
          - diverted
        description: Flight status filter
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 30000
        description: Maximum number of records to return
      responses:
        '200':
          description: Real-time flight tracker result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flight'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - aircraft:
                      iataCode: B77W
                      icao24: C0173A
                      icaoCode: B77W
                      regNumber: C-FIUR
                    airline:
                      iataCode: AC
                      icaoCode: ACA
                    arrival:
                      iataCode: YYZ
                      icaoCode: CYYZ
                    departure:
                      iataCode: GRU
                      icaoCode: SBGR
                    flight:
                      iataNumber: AC91
                      icaoNumber: ACA091
                      number: '91'
                    geography:
                      altitude: 10363.2
                      direction: 342.0
                      latitude: 23.36
                      longitude: -70.37
                    speed:
                      horizontal: 820.436
                      isGround: 0.0
                      vspeed: 0.0
                    status: en-route
                    system:
                      squawk: null
                      updated: 1643111484
      externalDocs:
        url: https://aviation-edge.com/flight-radar-and-tracker-api/
        description: Provider documentation
  /flightsHistory:
    get:
      tags:
      - Real-Time
      summary: Historical airport schedules
      description: Returns the historical departure or arrival schedule of an airport for a date or date range of
        up to 30 days. Standard access covers the last year; five-year access is available on request.
      operationId: getHistoricalFlights
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: code
        in: query
        schema:
          type: string
        required: true
        description: Airport IATA code
      - name: type
        in: query
        schema:
          type: string
          enum:
          - departure
          - arrival
        required: true
        description: departure or arrival
      - name: date_from
        in: query
        schema:
          type: string
        description: Start date, YYYY-MM-DD
      - name: date_to
        in: query
        schema:
          type: string
        description: End date, YYYY-MM-DD
      - name: airline_iata
        in: query
        schema:
          type: string
        description: Filter by airline IATA code
      - name: flight_number
        in: query
        schema:
          type: string
        description: Filter by flight number
      - name: status
        in: query
        schema:
          type: string
          enum:
          - landed
          - cancelled
          - active
          - unknown
        description: Filter by flight status
      responses:
        '200':
          description: Historical airport schedules result set. An error is also returned with HTTP 200 and the
            Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleFlight'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - airline:
                      iataCode: WS
                      icaoCode: WJA
                      name: WestJet
                    arrival:
                      actualRunway: '2022-01-24T23:48:00.000'
                      actualTime: '2022-01-24T23:48:00.000'
                      baggage: null
                      delay: '19'
                      estimatedRunway: '2022-01-24T23:48:00.000'
                      estimatedTime: '2022-01-24T23:29:00.000'
                      gate: A15
                      iataCode: IAH
                      icaoCode: KIAH
                      scheduledTime: '2022-01-24T23:29:00.000'
                      terminal: A
        '400':
          description: A required parameter is missing. Observed by live probe 2026-09-04.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingParam:
                  value:
                    message:
                      type: 'Missing param: type (str)'
      externalDocs:
        url: https://aviation-edge.com/historical-flight-schedules-api/
        description: Provider documentation
  /timetable:
    get:
      tags:
      - Schedules
      summary: Real-time airport timetable
      description: Returns the real-time departure or arrival timetable of an airport, including delays, gates,
        terminals and cancellations. Covers roughly a twelve hour window around the current time and updates about
        every 15 minutes.
      operationId: getTimetable
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: iataCode
        in: query
        schema:
          type: string
        required: true
        description: Airport IATA code
      - name: type
        in: query
        schema:
          type: string
          enum:
          - departure
          - arrival
        required: true
        description: departure or arrival
      - name: airline_iata
        in: query
        schema:
          type: string
        description: Filter by airline IATA code
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - active
          - landed
          - cancelled
          - incident
          - diverted
          - redirected
        description: Filter by flight status
      responses:
        '200':
          description: Real-time airport timetable result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleFlight'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - airline:
                      iataCode: WS
                      icaoCode: WJA
                      name: WestJet
                    arrival:
                      actualRunway: '2022-01-24T23:48:00.000'
                      actualTime: '2022-01-24T23:48:00.000'
                      baggage: null
                      delay: '19'
                      estimatedRunway: '2022-01-24T23:48:00.000'
                      estimatedTime: '2022-01-24T23:29:00.000'
                      gate: A15
                      iataCode: IAH
                      icaoCode: KIAH
                      scheduledTime: '2022-01-24T23:29:00.000'
                      terminal: A
      externalDocs:
        url: https://aviation-edge.com/flight-schedule-and-timetable-of-airlines-and-airports/
        description: Provider documentation
  /flightsFuture:
    get:
      tags:
      - Schedules
      summary: Future airport schedules
      description: Returns the departure or arrival schedule of an airport for a future date, up to one year ahead.
        Dates within seven days of today are not served.
      operationId: getFutureFlights
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: iataCode
        in: query
        schema:
          type: string
        required: true
        description: Airport IATA code
      - name: type
        in: query
        schema:
          type: string
          enum:
          - departure
          - arrival
        required: true
        description: departure or arrival
      - name: date
        in: query
        schema:
          type: string
        required: true
        description: Future date, YYYY-MM-DD
      - name: arr_iataCode
        in: query
        schema:
          type: string
        description: Filter a departure schedule by arrival airport IATA code
      - name: dep_iataCode
        in: query
        schema:
          type: string
        description: Filter an arrival schedule by departure airport IATA code
      responses:
        '200':
          description: Future airport schedules result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FutureFlight'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - weekday: '1'
                    departure:
                      iataCode: mty
                      icaoCode: mmmy
                      terminal: c
                      gate: f2
                      scheduledTime: '20:35'
                    arrival:
                      iataCode: iah
                      icaoCode: kiah
                      terminal: d
                      gate: d12
                      scheduledTime: '22:00'
                    aircraft:
                      modelCode: a320
                      modelText: airbus a320-232
                    airline:
                      name: vivaaerobus
                      iataCode: vb
                      icaoCode: viv
                    flight:
                      number: '616'
                      iataNumber: vb616
                      icaoNumber: viv616
        '400':
          description: A required parameter is missing. Observed by live probe 2026-09-04.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingParam:
                  value:
                    message:
                      type: 'Missing param: type (str)'
      externalDocs:
        url: https://aviation-edge.com/future-flight-schedules-and-timetables-of-airports-api/
        description: Provider documentation
  /routes:
    get:
      tags:
      - Reference
      summary: Airline routes
      description: Returns the static operating routes of airlines, filterable by departure airport, airline or
        flight number.
      operationId: getRoutes
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: departureIata
        in: query
        schema:
          type: string
        description: Departure airport IATA code
      - name: departureIcao
        in: query
        schema:
          type: string
        description: Departure airport ICAO code
      - name: airlineIata
        in: query
        schema:
          type: string
        description: Airline IATA code
      - name: airlineIcao
        in: query
        schema:
          type: string
        description: Airline ICAO code
      - name: flightNumber
        in: query
        schema:
          type: string
        description: Flight number
      responses:
        '200':
          description: Airline routes result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - departureIata: OTP
                    departureIcao: LROP
                    departureTerminal: null
                    departureTime: 09:15:00
                    arrivalIata: TRN
                    arrivalIcao: LIMF
                    arrivalTerminal: null
                    arrivalTime: '10:45:00'
                    airlineIata: 0B
                    airlineIcao: BMS
                    flightNumber: '101'
                    codeshares: null
                    regNumber: YR-BAP
      externalDocs:
        url: https://aviation-edge.com/airline-routes-database-and-api/
        description: Provider documentation
  /airportDatabase:
    get:
      tags:
      - Reference
      summary: Airports database
      description: 'Returns the static airports database: IATA and ICAO codes, coordinates, timezone, country and
        city references.'
      operationId: getAirports
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIataAirport
        in: query
        schema:
          type: string
        description: Airport IATA code
      - name: codeIso2Country
        in: query
        schema:
          type: string
        description: ISO 3166-1 alpha-2 country code
      responses:
        '200':
          description: Airports database result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airport'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - airportId: '7'
                    nameAirport: Aachen/Merzbruck
                    codeIataAirport: AAH
                    codeIcaoAirport: EDKA
                    latitudeAirport: '50.75'
                    longitudeAirport: '6.133333'
                    geonameId: '3247449'
                    timezone: Europe/Berlin
                    GMT: '1'
                    phone: ''
                    nameCountry: Germany
                    codeIso2Country: DE
                    codeIataCity: AAH
      externalDocs:
        url: https://aviation-edge.com/airport-database-api/
        description: Provider documentation
  /airlineDatabase:
    get:
      tags:
      - Reference
      summary: Airlines database
      description: 'Returns the static airlines database: IATA and ICAO codes, callsign, hub, fleet size and status.'
      operationId: getAirlines
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIataAirline
        in: query
        schema:
          type: string
        description: Airline IATA code
      - name: codeIso2Country
        in: query
        schema:
          type: string
        description: ISO 3166-1 alpha-2 country code
      responses:
        '200':
          description: Airlines database result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airline'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - airlineId: '1'
                    nameAirline: American Airlines
                    codeIataAirline: AA
                    iataPrefixAccounting: '1'
                    codeIcaoAirline: AAL
                    callsign: AMERICAN
                    type: scheduled
                    statusAirline: active
                    sizeAirline: '963'
                    ageFleet: '10.9'
                    founding: '1934'
                    codeHub: DFW
                    nameCountry: United States
                    codeIso2Country: US
      externalDocs:
        url: https://aviation-edge.com/airline-names-database/
        description: Provider documentation
  /airplaneDatabase:
    get:
      tags:
      - Reference
      summary: Airplanes database
      description: 'Returns the static airframe database: registration, construction number, model, engines, delivery
        dates and status.'
      operationId: getAircraft
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: numberRegistration
        in: query
        schema:
          type: string
        description: Aircraft registration number, e.g. HB-JVE
      - name: hexIcaoAirplane
        in: query
        schema:
          type: string
        description: ICAO 24-bit hex address, e.g. 4B19EA
      - name: codeIataAirline
        in: query
        schema:
          type: string
        description: Operator airline IATA code
      responses:
        '200':
          description: Airplanes database result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airplane'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - airplaneId: '55'
                    numberRegistration: HB-JVE
                    productionLine: Fokker 28/70/100
                    airplaneIataType: F28 MK0100
                    planeModel: F-100
                    modelCode: F100
                    hexIcaoAirplane: 4B19EA
                    codeIataPlaneShort: '100'
                    codeIataPlaneLong: F100
                    constructionNumber: '11459'
                    numberTestRgistration: PH-EZD
                    rolloutDate: '0000-00-00'
                    firstFlight: '1993-05-31T22:00:00.000Z'
                    deliveryDate: '1993-06-29T22:00:00.000Z'
                    registrationDate: '2004-05-11T22:00:00.000Z'
                    lineNumber: ''
                    planeSeries: ''
                    codeIataAirline: 2L
                    codeIcaoAirline: ''
                    planeOwner: ''
                    enginesCount: '2'
                    enginesType: JET
                    planeAge: '24'
                    planeStatus: active
      externalDocs:
        url: https://aviation-edge.com/aircraft-database/
        description: Provider documentation
  /planeTypeDatabase:
    get:
      tags:
      - Reference
      summary: Airplane types database
      description: 'Returns the static aircraft type database: IATA aircraft codes and type names.'
      operationId: getAircraftTypes
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIataAircraft
        in: query
        schema:
          type: string
        description: IATA aircraft type code
      responses:
        '200':
          description: Airplane types database result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaneType'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - planeTypeId: '100'
                    nameAircraft: Boeing 767-200 Freighter
                    codeIataAircraft: 76X
      externalDocs:
        url: https://aviation-edge.com/aircraft-database/
        description: Provider documentation
  /cityDatabase:
    get:
      tags:
      - Reference
      summary: Cities database
      description: 'Returns the static cities database: IATA city codes, coordinates, timezone and country.'
      operationId: getCities
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIataCity
        in: query
        schema:
          type: string
        description: City IATA code
      - name: codeIso2Country
        in: query
        schema:
          type: string
        description: ISO 3166-1 alpha-2 country code
      responses:
        '200':
          description: Cities database result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - cityId: '1'
                    nameCity: Anaa
                    codeIataCity: AAA
                    codeIso2Country: PF
                    latitudeCity: '-17.05'
                    longitudeCity: '-145.41667'
                    timezone: Pacific/Tahiti
                    GMT: '-10'
                    geonameId: '0'
      externalDocs:
        url: https://aviation-edge.com/world-city-database/
        description: Provider documentation
  /countryDatabase:
    get:
      tags:
      - Reference
      summary: Countries database
      description: 'Returns the static countries database: ISO codes, currency, continent, population, capital and
        phone prefix.'
      operationId: getCountries
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIso2Country
        in: query
        schema:
          type: string
        description: ISO 3166-1 alpha-2 country code
      - name: nameCountry
        in: query
        schema:
          type: string
        description: Country name
      responses:
        '200':
          description: Countries database result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - countryId: '1'
                    nameCountry: Andorra
                    codeIso2Country: AD
                    codeIso3Country: AND
                    numericIso: '20'
                    population: '84000'
                    capital: Andorra la Vella
                    continent: EU
                    nameCurrency: Euro
                    codeCurrency: EUR
                    codeFips: AN
                    phonePrefix: '376'
      externalDocs:
        url: https://aviation-edge.com/countries-database/
        description: Provider documentation
  /taxDatabase:
    get:
      tags:
      - Reference
      summary: Aviation taxes database
      description: 'Returns the static aviation tax code database: IATA tax codes and their names.'
      operationId: getTaxes
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: codeIataTax
        in: query
        schema:
          type: string
        description: IATA tax code
      responses:
        '200':
          description: Aviation taxes database result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tax'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - taxId: '1'
                    nameTax: Government Tax
                    codeIataTax: AB
      externalDocs:
        url: https://aviation-edge.com/airline-tax-codes/
        description: Provider documentation
  /timezoneDatabase:
    get:
      tags:
      - Reference
      summary: Airport timezones database
      description: Returns the static airport timezone database. Endpoint confirmed live on 2026-09-04; Aviation
        Edge does not publish a response example for it, so no response schema is asserted here.
      operationId: getTimezones
      parameters:
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: Airport timezones database result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimezoneRecord'
      externalDocs:
        url: https://aviation-edge.com/airport-time-zone-database/
        description: Provider documentation
  /autocomplete:
    get:
      tags:
      - Reference
      summary: Aviation autocomplete
      description: Returns matching cities, airports, rail and bus stations for a partial text query. The response
        is grouped into cities, airports and airportsByCities collections.
      operationId: autocomplete
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: city
        in: query
        schema:
          type: string
        required: true
        description: Partial name or code to search for
      responses:
        '200':
          description: Aviation autocomplete result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - code: AMS
                    name: Schiphol
                    cityCode: AMS
                    cityName: Amsterdam
                    countryCode: NL
                    countryName: Netherlands
                    lat: 52.30907
                    lng: 4.763385
                    timezone: Europe/Amsterdam
                    type: airport
                    isRailRoad: 0
                    isBusStation: 0
      externalDocs:
        url: https://aviation-edge.com/airport-autocomplete/
        description: Provider documentation
  /nearby:
    get:
      tags:
      - Reference
      summary: Nearby airports and cities
      description: Returns airports, cities and other transport locations within a radius of a coordinate, with
        the distance to each.
      operationId: getNearby
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: lat
        in: query
        schema:
          type: number
        required: true
        description: Latitude
      - name: lng
        in: query
        schema:
          type: number
        required: true
        description: Longitude
      - name: distance
        in: query
        schema:
          type: integer
        description: Search radius
      responses:
        '200':
          description: Nearby airports and cities result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - code: BUW
                    icao: WAWB
                    name: Baubau
                    cityCode: BUW
                    cityName: Baubau
                    countryCode: ID
                    countryName: Indonesia
                    lat: -5.466667
                    lng: 122.63333
                    timezone: Asia/Makassar
                    type: airport
                    isRailRoad: 0
                    isBusStation: 0
                    distance: 0
      externalDocs:
        url: https://aviation-edge.com/nearby-airport-and-city-api/
        description: Provider documentation
  /satelliteDetails:
    get:
      tags:
      - Satellites
      summary: Satellite tracker
      description: Returns orbiting satellites and objects with their propagated position, orbital elements and
        TLE sets.
      operationId: getSatelliteDetails
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: code
        in: query
        schema:
          type: string
        description: NORAD catalog number
      - name: launchYear
        in: query
        schema:
          type: integer
        description: Year of launch
      - name: intldes
        in: query
        schema:
          type: string
        description: NSSDC international designator
      - name: orbitalapogee
        in: query
        schema:
          type: integer
        description: Orbital apogee filter
      - name: orbitalperigee
        in: query
        schema:
          type: integer
        description: Orbital perigee filter
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 30000
        description: Maximum records to return
      responses:
        '200':
          description: Satellite tracker result set. An error is also returned with HTTP 200 and the Error envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Satellite'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - code: 408
                    country: US
                    intldes: 1961-015EH
                    launchDate: '1961-06-29'
                    launchNum: '15'
                    launchPart: EH
                    launchYear: '1961'
                    name: THOR ABLESTAR DEB
                    orbitalApogee: '1035'
                    orbitalInclination: '66.79'
                    orbitalPerigee: '929'
                    orbitalPeriod: '104.73'
                    result:
                      ECI:
                        posX: 0.5454890369
                        posY: -0.2586148768
                        posZ: -0.9850851542
                        velX: 0.0575062685
                        velY: 0.0304486006
                        velZ: 0.0232874073
                      geography:
                        alt: 1006.4047009328
                        lat: -58.6467050931
                        lon: 129.4707358377
                      satelliteInfo:
                        classification: U
                        idLaunchNumber: '015'
                        idLaunchPiece: 'EH '
                        idLaunchYear: '61'
                        orbit: 99888
                        rightAscension: 21.7828
                        satnumber: 408
                    size: MEDIUM
                    tle1: 1 408U 61015EH 20129.79820524 -.00000021 +00000-0 +54301-4 0 9997
                    tle2: 2 408 066.7883 021.7828 0070545 199.3274 220.5694 13.74946678998881
                    type: DEBRIS
                    updated: 1589063274000
      externalDocs:
        url: https://aviation-edge.com/satellite-tracking-api/
        description: Provider documentation
  /notams:
    get:
      tags:
      - NOTAMs
      summary: Airport and FIR NOTAMs
      description: Returns real-time and historical NOTAMs for an airport (by IATA or ICAO code) or for a Flight
        Information Region (by location code), optionally bounded by a date range.
      operationId: getNotams
      parameters:
      - $ref: '#/components/parameters/Key'
      - name: iata
        in: query
        schema:
          type: string
        description: Airport IATA code
      - name: icao
        in: query
        schema:
          type: string
        description: Airport ICAO code
      - name: location
        in: query
        schema:
          type: string
        description: FIR location code, used instead of an airport code
      - name: date_from
        in: query
        schema:
          type: string
        description: Start of the historical window, YYYY-MM-DD
      - name: date_to
        in: query
        schema:
          type: string
        description: End of the historical window, YYYY-MM-DD
      responses:
        '200':
          description: Airport and FIR NOTAMs result set. An error is also returned with HTTP 200 and the Error
            envelope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notam'
              examples:
                sample:
                  summary: Published provider example
                  value:
                  - location: lfpo
                    number: a4247/26
                    class: international
                    startdateutc: '2026-08-06t22:00:00'
                    enddateutc: '2027-06-10t22:00:00'
                    condition: a4247/26 notamnq) ... restriction of use of ad lfpo due to repair work on runway
                      06/24.
      externalDocs:
        url: https://aviation-edge.com/notam-api/
        description: Provider documentation
components:
  parameters:
    Key:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: Aviation Edge API key
  schemas:
    Airline:
      type: object
      properties:
        airlineId:
          type: string
        nameAirline:
          type: string
        codeIataAirline:
          type: string
        iataPrefixAccounting:
          type: string
        codeIcaoAirline:
          type: string
        callsign:
          type: string
        type:
          type: string
        statusAirline:
          type: string
        sizeAirline:
          type: string
        ageFleet:
          type: string
        founding:
          type: string
        codeHub:
          type: string
        nameCountry:
          type: string
        codeIso2Country:
          type: string
      description: An airline record from the static Airlines database.
    Airplane:
      type: object
      properties:
        airplaneId:
          type: string
        numberRegistration:
          type: string
        productionLine:
          type: string
        airplaneIataType:
          type: string
        planeModel:
          type: string
        modelCode:
          type: string
        hexIcaoAirplane:
          type: string
        codeIataPlaneShort:
          type: string
        codeIataPlaneLong:
          type: string
        constructionNumber:
          type: string
        numberTestRgistration:
          type: string
        rolloutDate:
          type: string
        firstFlight:
          type: string
        deliveryDate:
          type: string
        registrationDate:
          type: string
        lineNumber:
          type: string
        planeSeries:
          type: string
        codeIataAirline:
          type: string
        codeIcaoAirline:
          type: string
        planeOwner:
          type: string
        enginesCount:
          type: string
        enginesType:
          type: string
        planeAge:
          type: string
        planeStatus:
          type: string
      description: An individual airframe from the static Airplanes database.
    Airport:
      type: object
      properties:
        airportId:
          type: string
        nameAirport:
          type: string
        codeIataAirport:
          type: string
        codeIcaoAirport:
          type: string
        latitudeAirport:
          type: string
        longitudeAirport:
          type: string
        geonameId:
          type: string
        timezone:
          type: string
        GMT:
          type: string
        phone:
          type: string
        nameCountry:
          type: string
        codeIso2Country:
          type: string
        codeIataCity:
          type: string
      description: An airport record from the static Airports database.
    City:
      type: object
      properties:
        cityId:
          type: string
        nameCity:
          type: string
        codeIataCity:
          type: string
        codeIso2Country:
          type: string
        latitudeCity:
          type: string
        longitudeCity:
          type: string
        timezone:
          type: string
        GMT:
          type: string
        geonameId:
          type: string
      description: A city record from the static Cities database.
    Country:
      type: object
      properties:
        countryId:
          type: string
        nameCountry:
          type: string
        codeIso2Country:
          type: string
        codeIso3Country:
          type: string
        numericIso:
          type: string
        population:
          type: string
        capital:
          type: string
        continent:
          type: string
        nameCurrency:
          type: string
        codeCurrency:
          type: string
        codeFips:
          type: string
        phonePrefix:
          type: string
      description: A country record from the static Countries database.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message returned for some endpoints
        message:
          type: string
          description: Error message returned for other endpoints; may also be an object keyed by the missing parameter
        success:
          type: boolean
          description: Always false on an error response
      description: Aviation Edge error envelope. Most endpoints return HTTP 200 with this body when the API key
        is missing or invalid; /flightsHistory and /flightsFuture return HTTP 400 for a missing required parameter.
        Observed by live probe 2026-09-04.
      examples:
      - message: Missing API Key
        success: false
      - error: Invalid API Key
        success: false
    Flight:
      type: object
      properties:
        aircraft:
          type: object
          properties:
            iataCode:
              type: string
            icao24:
              type: string
            icaoCode:
              type: string
            regNumber:
              type: string
        airline:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
        arrival:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
        departure:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
        flight:
          type: object
          properties:
            iataNumber:
              type: string
            icaoNumber:
              type: string
            number:
              type: string
        geography:
          type: object
          properties:
            altitude:
              type: number
            direction:
              type: number
            latitude:
              type: number
            longitude:
              type: number
        speed:
          type: object
          properties:
            horizontal:
              type: number
            isGround:
              type: number
            vspeed:
              type: number
        status:
          type: string
          description: Flight status, e.g. en-route, scheduled, landed, cancelled, incident, diverted
        system:
          type: object
          properties:
            squawk:
              type:
              - string
              - 'null'
            updated:
              type: integer
              description: Unix timestamp of the last position update
      description: A live tracked flight as returned by the Flights Tracker API.
    FutureFlight:
      type: object
      properties:
        weekday:
          type: string
          description: Day of the week of the flight, "1" being Monday
        departure:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            terminal:
              type: string
            gate:
              type: string
            scheduledTime:
              type: string
        arrival:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            terminal:
              type: string
            gate:
              type: string
            scheduledTime:
              type: string
        aircraft:
          type: object
          properties:
            modelCode:
              type: string
            modelText:
              type: string
        airline:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            name:
              type: string
        flight:
          type: object
          properties:
            number:
              type: string
            iataNumber:
              type: string
            icaoNumber:
              type: string
      description: A future-dated schedule record, generated from historical schedule data.
    Location:
      type: object
      properties:
        code:
          type: string
        icao:
          type: string
        name:
          type: string
        cityCode:
          type: string
        cityName:
          type: string
        countryCode:
          type: string
        countryName:
          type: string
        lat:
          type: number
        lng:
          type: number
        timezone:
          type: string
        type:
          type: string
          description: city, airport, rail_station, bus_station, heliport, seaport and similar
        isRailRoad:
          type: integer
        isBusStation:
          type: integer
        distance:
          type: number
          description: Distance from the queried coordinates, in metres (Nearby API only)
      description: An airport, city or other transport location.
    Notam:
      type: object
      properties:
        location:
          type: string
          description: Airport ICAO code or FIR location code
        number:
          type: string
          description: NOTAM number, e.g. a4247/26
        class:
          type: string
          description: NOTAM class, e.g. international
        startdateutc:
          type: string
          description: Start of validity, UTC
        enddateutc:
          type: string
          description: End of validity, UTC
        condition:
          type: string
          description: The original NOTAM message text
      description: A NOTAM record for an airport or FIR.
    PlaneType:
      type: object
      properties:
        planeTypeId:
          type: string
        nameAircraft:
          type: string
        codeIataAircraft:
          type: string
      description: An aircraft type from the static Airplane-Types database.
    Route:
      type: object
      properties:
        departureIata:
          type: string
        departureIcao:
          type: string
        departureTerminal:
          type:
          - string
          - 'null'
        departureTime:
          type: string
        arrivalIata:
          type: string
        arrivalIcao:
          type: string
        arrivalTerminal:
          type:
          - string
          - 'null'
        arrivalTime:
          type: string
        airlineIata:
          type: string
        airlineIcao:
          type: string
        flightNumber:
          type: string
        codeshares:
          type:
          - string
          - 'null'
        regNumber:
          type: string
      description: A scheduled airline route between two airports.
    Satellite:
      type: object
      properties:
        code:
          type: integer
          description: NORAD catalog number
        country:
          type: string
        intldes:
          type: string
          description: NSSDC international designator
        launchDate:
          type: string
        launchNum:
          type: string
        launchPart:
          type: string
        launchYear:
          type: string
        name:
          type: string
        orbitalApogee:
          type: string
        orbitalInclination:
          type: string
        orbitalPerigee:
          type: string
        orbitalPeriod:
          type: string
        result:
          type: object
          properties:
            ECI:
              type: object
              properties:
                posX:
                  type: number
                posY:
                  type: number
                posZ:
                  type: number
                velX:
                  type: number
                velY:
                  type: number
                velZ:
                  type: number
            geography:
              type: object
              properties:
                alt:
                  type: number
                lat:
                  type: number
                lon:
                  type: number
            satelliteInfo:
              type: object
              properties:
                classification:
                  type: string
                idLaunchNumber:
                  type: string
                idLaunchPiece:
                  type: string
                idLaunchYear:
                  type: string
                orbit:
                  type: integer
                rightAscension:
                  type: number
                satnumber:
                  type: integer
        size:
          type: string
        tle1:
          type: string
        tle2:
          type: string
        type:
          type: string
        updated:
          type: integer
      description: An orbiting satellite or object, with its current propagated position and TLE set.
    ScheduleFlight:
      type: object
      properties:
        type:
          type: string
          description: departure or arrival
        status:
          type: string
          description: scheduled, active, landed, cancelled, incident, diverted or redirected
        airline:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            name:
              type: string
        departure:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            terminal:
              type: string
            gate:
              type: string
            baggage:
              type: string
            delay:
              type: string
              description: Delay in minutes
            scheduledTime:
              type: string
            estimatedTime:
              type: string
            actualTime:
              type: string
            estimatedRunway:
              type: string
            actualRunway:
              type: string
        arrival:
          type: object
          properties:
            iataCode:
              type: string
            icaoCode:
              type: string
            terminal:
              type: string
            gate:
              type: string
            baggage:
              type: string
            delay:
              type: string
              description: Delay in minutes
            scheduledTime:
              type: string
            estimatedTime:
              type: string
            actualTime:
              type: string
            estimatedRunway:
              type: string
            actualRunway:
              type: string
        flight:
          type: object
          properties:
            number:
              type: string
            iataNumber:
              type: string
            icaoNumber:
              type: string
        codeshared:
          type:
          - object
          - 'null'
          properties: {}
          description: Populated when the flight is a codeshare; see https://aviation-edge.com/codeshares-object-description/
      description: An airport timetable record. The same shape is returned by the real-time /timetable and the historical
        /flightsHistory endpoints.
    Tax:
      type: object
      properties:
        taxId:
          type: string
        nameTax:
          type: string
        codeIataTax:
          type: string
      description: An aviation tax code from the static Taxes database.
    TimezoneRecord:
      type: object
      properties: {}
      additionalProperties: true
      description: An airport timezone record. Aviation Edge publishes no response example for /timezoneDatabase,
        so the fields are not asserted here.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: key
      description: API key issued with an Aviation Edge subscription, passed as the `key` query parameter.
