  to: Airport
  type: has_one
  via: departure.iataCode / arrival.iataCode -> Airport.codeIataAirport
- from: Flight
  to: Airline
  type: has_one
  via: airline.iataCode -> Airline.codeIataAirline
- from: Flight
  to: Airplane
  type: has_one
  via: aircraft.regNumber -> Airplane.numberRegistration (also aircraft.icao24 -> Airplane.hexIcaoAirplane)
- from: ScheduleFlight
