- from: Route
  to: Airline
  type: has_one
  via: airlineIata -> Airline.codeIataAirline
- from: Route
  to: Airplane
  type: has_one
  via: regNumber -> Airplane.numberRegistration
- from: Airport
  to: City
  type: belongs_to
  via: codeIataCity -> City.codeIataCity
- from: Airport
  to: Country
  type: belongs_to
  via: codeIso2Country -> Country.codeIso2Country
- from: City
