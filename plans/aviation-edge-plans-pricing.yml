notes:
  - >-
    The pricing page and the free-api-key page disagree on the first-month rates: the pricing
    table shows $7 / $15 / $39 while https://aviation-edge.com/free-api-key/ and the FAQ cite
    "$15, 29$ or 79$" and "as low as $15". The pricing table values are recorded above as the
    primary source; the discrepancy is the provider's, not this record's.
  - >-
    Standalone database downloads (Excel/CSV/SQL) are sold separately from API subscriptions
    and run on a different dashboard; their pricing is not published on the API pricing page.
