description: >-
  Aviation Edge subscription plans, read from the provider's own pricing page on 2026-09-04.
  This file replaces the 2026-05-04 scaffold, whose tiers and prices were placeholders.
  Every plan grants access to the full API surface; the tiers differ only in the monthly API
  call allowance. The advertised low price is a first-month test rate — the subscription
  auto-renews at the regular rate thereafter.
plan_count: 4
currency: USD
billing_period: month
free_tier: false
free_tier_note: >-
  Aviation Edge withdrew its free API key. https://aviation-edge.com/free-api-key/ states
  the feature was removed due to abuse, and the FAQ confirms the free trial is disabled; the
  discounted first month is now the only way to evaluate the data. There is no test key,
  so an unauthenticated evaluation of the live API is not possible.
discounts:
  - type: annual
    amount: 10%
    note: 10% discount on annual payment for any plan, per the FAQ.
  - type: academic
    amount: negotiated
    note: >-
      Students and non-commercial projects are invited to contact the provider; free access
      is granted in exchange for a backlink attributing Aviation Edge as the source.
